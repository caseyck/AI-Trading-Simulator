name: Deploy to CloudBase

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Hosting and Binance function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secrets
        shell: bash
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          test -n "$TENCENT_SECRET_ID" || { echo "Missing GitHub secret: TENCENT_SECRET_ID"; exit 1; }
          test -n "$TENCENT_SECRET_KEY" || { echo "Missing GitHub secret: TENCENT_SECRET_KEY"; exit 1; }
          test -n "$TCB_ENV_ID" || { echo "Missing GitHub secret: TCB_ENV_ID"; exit 1; }

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli

      - name: Authenticate CloudBase CLI
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: tcb login --apiKeyId "$TENCENT_SECRET_ID" --apiKey "$TENCENT_SECRET_KEY"

      - name: Prepare static Hosting files
        shell: bash
        run: |
          mkdir -p .cloudbase-hosting
          cp index.html styles.css app.js early-history.js .cloudbase-hosting/

      - name: Deploy Binance cloud function
        run: tcb fn deploy binance --env-id "$TCB_ENV_ID" --yes

      - name: Deploy static Hosting
        run: tcb hosting deploy .cloudbase-hosting / --env-id "$TCB_ENV_ID"

      - name: Show Hosting details
        run: tcb hosting detail --env-id "$TCB_ENV_ID"
